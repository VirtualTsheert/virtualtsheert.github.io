<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cute robot in the rain</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b12;color:#c9cbe0;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
#wrap{width:100%;max-width:1100px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{background:transparent;color:#e6e8ff;border:1px solid #3a3b55;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button:hover{background:#1a1b2b}
</style>
</head>
<body>
<div id="wrap">
<h1 class="sr-only">Cute robot holding an umbrella on a rainy neon city street</h1>
<div id="box" style="position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#05060f;touch-action:pan-y">
<canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
<div id="shot" style="position:absolute;left:16px;bottom:calc(5.5% + 10px);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#e6e8ff;opacity:0;transition:opacity .6s;pointer-events:none"></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px">
<button id="pp" aria-label="Pause animation"><span id="ppt">Pause</span></button>
<button id="nx">Next shot</button>
<span style="font-size:13px;color:#8f91a8">Move your pointer over the scene to nudge the camera</span>
</div>
</div>
<script>
(()=>{
const box=document.getElementById('box'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),shotEl=document.getElementById('shot');
const rc=document.createElement('canvas'),rcx=rc.getContext('2d');
const PI=Math.PI,TAU=PI*2,rnd=Math.random;
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
let W=680,H=383,D=1,vig=null,running=true,visible=true,looping=false,last=null,T=0,camT=0,FL=0,curShot=-1,shotTimer=null;
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hs(a,b,c){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function rgb(h){const n=parseInt(h.slice(1),16);return(n>>16)+','+((n>>8)&255)+','+(n&255);}
const C={x:0,y:1,z:0,yaw:0,pitch:0,roll:0,f:400,cy:1,sy:0,cp:1,sp:0,hz:200};
let px=0,py=0,pz=0,pk=0;
function P(x,y,z){const dx=x-C.x,dy=y-C.y,dz=z-C.z,ax=dx*C.cy-dz*C.sy;let az=dx*C.sy+dz*C.cy;const ay=dy*C.cp-az*C.sp;az=dy*C.sp+az*C.cp;if(az<.05)return false;pk=C.f/az;px=W/2+ax*pk;py=H/2-ay*pk;pz=az;return true;}
function cs(x,y,z){const dx=x-C.x,dy=y-C.y,dz=z-C.z,ax=dx*C.cy-dz*C.sy;let az=dx*C.sy+dz*C.cy;const ay=dy*C.cp-az*C.sp;az=dy*C.sp+az*C.cp;return[ax,ay,az];}
function poly(c,pts){const N=.06,o=[],q=pts.map(p=>cs(p[0],p[1],p[2]));for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];if(a[2]>=N)o.push(a);if((a[2]>=N)!==(b[2]>=N)){const t=(N-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,N]);}}if(o.length<3)return false;for(let i=0;i<o.length;i++){const k=C.f/o[i][2],X=W/2+o[i][0]*k,Y=H/2-o[i][1]*k;if(i)c.lineTo(X,Y);else c.moveTo(X,Y);}c.closePath();return true;}
function seg(c,x0,y0,z0,x1,y1,z1){const N=.06;let a=cs(x0,y0,z0),b=cs(x1,y1,z1);if(a[2]<N&&b[2]<N)return;if(a[2]<N){const t=(N-a[2])/(b[2]-a[2]);a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,N];}else if(b[2]<N){const t=(N-b[2])/(a[2]-b[2]);b=[b[0]+(a[0]-b[0])*t,b[1]+(a[1]-b[1])*t,N];}let k=C.f/a[2];c.moveTo(W/2+a[0]*k,H/2-a[1]*k);k=C.f/b[2];c.lineTo(W/2+b[0]*k,H/2-b[1]*k);}
const gq=(c,x0,z0,x1,z1)=>poly(c,[[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]]);
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

const R={x:0,z:5};
const LAYERS=[
{z:210,x0:-280,x1:280,w:[10,24],h:[35,110],col:'#1c1d42',cw:3,ch:3.6,ww:.45,wh:.4,lit:.28,wa:.32,gap:.25,base:1.1,sd:11},
{z:120,x0:-190,x1:190,w:[8,18],h:[25,78],col:'#17173a',cw:2.2,ch:2.8,ww:.5,wh:.45,lit:.3,wa:.45,gap:.3,base:1.1,sd:23},
{z:60,x0:-130,x1:130,w:[6,14],h:[16,50],col:'#121231',cw:1.7,ch:2.3,ww:.55,wh:.5,lit:.32,wa:.6,gap:.35,base:1.1,sd:37},
{z:27,x0:-80,x1:80,w:[5,11],h:[11,34],col:'#0d0d24',cw:1.45,ch:2.1,ww:.6,wh:.5,lit:.35,wa:.75,gap:.45,base:2.9,sd:51}];
LAYERS.forEach((L,li)=>{const r=rng(L.sd);L.b=[];let x=L.x0;while(x<L.x1){const w=lerp(L.w[0],L.w[1],r()),h=lerp(L.h[0],L.h[1],r());L.b.push({x,w,h,z:L.z+r()*L.z*.03,top:r()<.4?1+(r()*2|0):0,s:r()*1e9|0,ph:r()*10,shop:li===3&&r()<.65});x+=w+(r()<L.gap?L.w[0]*(.5+r()*1.4):.15);}L.b.sort((a,b)=>b.z-a.z);});
const NC=['#ff4fa3','#3df2ff','#ffcf4a','#a57dff','#4dffa6','#ff6b5a'],HT=['RAMEN','OPEN 24H','ROBO CAFE','NOODLES','ARCADE','HOTEL','KARAOKE','BAR'],VT=['ラーメン','ネオン','HOTEL','ROBO','CAFE','ゲーム','BAR'];
const SIGNS=[];{const r=rng(77);[2,3].forEach(li=>{const L=LAYERS[li],s=li===3?1:1.7;L.b.forEach(b=>{if(r()>(li===3?.6:.3))return;const vert=r()<.4;let w,h,x,y;if(vert){w=1.05*s;h=(3.4+r()*1.4)*s;x=b.x+(r()<.5?.3:b.w-w-.3);y=(li===3?3.2:2.5)+r()*b.h*.35;}else{w=Math.min(b.w*.82,(2.8+r()*2.6)*s);h=1.2*s;x=b.x+(b.w-w)/2;y=(li===3?3.3:2.5)+r()*Math.min(8,b.h*.45);}if(y+h>b.h-.6)return;const col=NC[r()*NC.length|0];SIGNS.push({x,y,w,h,z:b.z-.25,col,rgb:rgb(col),t:vert?VT[r()*VT.length|0]:HT[r()*HT.length|0],vert,fl:r()<.2,ph:r()*10,L:li});});});}
const sOn=s=>!s.fl||Math.sin(T*17.3+s.ph)+Math.sin(T*5.1+s.ph*2)<1.5;
const LAMPS=[{x:2.4,z:6.9,h:3.7,a:-.75},{x:-7.5,z:19.4,h:4.3,a:.85},{x:10,z:19.4,h:4.3,a:-.85},{x:-16,z:6.9,h:3.7,a:.75}];
LAMPS.forEach(l=>{l.hx=l.x+l.a;l.hy=l.h-.14;});
const CL=[];{const r=rng(5);for(let i=0;i<10;i++)CL.push({az:-1.5+r()*3,el:.06+r()*.42,s:.12+r()*.2,a:.16+r()*.2});}

const sheetC=document.createElement('canvas');sheetC.width=sheetC.height=256;{const s=sheetC.getContext('2d');s.strokeStyle='rgba(200,215,255,.6)';s.lineWidth=1;s.beginPath();for(let i=0;i<110;i++){const x=rnd()*256,y=rnd()*256,l=8+rnd()*26;for(const ox of[0,-256,256])for(const oy of[0,-256]){s.moveTo(x+ox,y+oy);s.lineTo(x+ox-l*.11,y+oy+l);}}s.stroke();}
const sheetP=ctx.createPattern(sheetC,'repeat');
const grainC=document.createElement('canvas');grainC.width=grainC.height=128;{const g=grainC.getContext('2d'),im=g.createImageData(128,128);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);}
const grainP=ctx.createPattern(grainC,'repeat');

const U={x:.2,y:1.5,r:.78,rot:-.3,hx:.5,hy:-.74,tx:.1,ty:-1.97};
const S={bob:0,tilt:0,ex:0,ey:0,etx:0,ety:0,blink:1,happy:0,sur:0,sway:0,tap:0,ant:0,side:0};
let nb=2,bt=-9,ng=1,nh=6,ht=-99,nl=9,lt=-99,ntap=4,tapT=-99,nd=0;
const car={on:false,x:0,z:15.6,dir:1,v:12,col:'#d94f6e',n:2};
const CC=['#d94f6e','#2f6fd6','#f2b632','#6a55e0','#dcdce8'];
const fly={x:-150},SP=[],parts=[],ANT=[];
const NR=1100,HX=16,HZ=16,VX=-1.8,VY=-15.5,rX=new Float32Array(NR),rY=new Float32Array(NR),rZ=new Float32Array(NR),rS=new Float32Array(NR);
function respawn(i,fx,fz,top){rX[i]=fx+(rnd()*2-1)*HX;rZ[i]=fz+(rnd()*2-1)*HZ;rY[i]=top?9+rnd()*3:rnd()*12;rS[i]=.85+rnd()*.3;}
function splash(x,z){const fd=(x-C.x)*C.sy+(z-C.z)*C.cy;if(fd<.5||fd>13)return;if(SP.length>240)SP.shift();SP.push({x,z,t:T});}
function spray(x,y){for(let j=0;j<2;j++)parts.push({x,y,z:R.z-.12,vx:(rnd()*2-1)*1.3,vy:.5+rnd()*1.3,k:1,l:.45});}

const SEG=6.5,K=[
{p:[-3.6,2.4,-4.2],t:[.5,1.6,6],f:1.0,r:0,n:'Wide establishing'},
{p:[-1.3,1.05,.4],t:[.35,1.15,5],f:1.12,r:-.012,n:'Slow push in'},
{p:[1.9,.42,1.8],t:[-.4,1.15,5],f:1.2,r:.028,n:'Low angle orbit'},
{p:[.55,1.18,3.05],t:[-.12,1.1,5],f:1.45,r:0,n:'Close up'},
{p:[-1.85,.6,2.1],t:[.42,1.05,5],f:1.15,r:-.035,n:'Dutch angle'},
{p:[-.6,3.4,-1.3],t:[.2,2.0,9],f:.95,r:0,n:'Crane reveal'}];
const ptr={x:0,y:0,tx:0,ty:0};
const catm=(a,b,c,d,t)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
function showShot(i){shotEl.style.opacity='0';clearTimeout(shotTimer);shotTimer=setTimeout(()=>{shotEl.textContent='Shot '+String(i+1).padStart(2,'0')+' · '+K[i].n;shotEl.style.opacity='.85';shotTimer=setTimeout(()=>{shotEl.style.opacity='0';},2600);},350);}
function updateCam(dt){const n=K.length,u=((camT/SEG)%n+n)%n,i=Math.floor(u),t=u-i,a=K[(i-1+n)%n],b=K[i],c=K[(i+1)%n],d=K[(i+2)%n];
const g=(k,j)=>catm(a[k][j],b[k][j],c[k][j],d[k][j],t);
const e=Math.min(1,dt*2.5);ptr.x=lerp(ptr.x,ptr.tx,e);ptr.y=lerp(ptr.y,ptr.ty,e);
C.x=g('p',0)+ptr.x*.6;C.y=Math.max(.25,g('p',1)-ptr.y*.35);C.z=g('p',2);
const dx=g('t',0)-C.x,dy=g('t',1)-C.y,dz=g('t',2)-C.z;
C.yaw=Math.atan2(dx,dz)+.004*(Math.sin(T*1.3)+.6*Math.sin(T*2.9+1.3));
C.pitch=Math.atan2(dy,Math.hypot(dx,dz))+.003*(Math.sin(T*1.7+.4)+.5*Math.sin(T*3.7));
C.roll=catm(a.r,b.r,c.r,d.r,t)+.002*Math.sin(T*1.1);C.f=catm(a.f,b.f,c.f,d.f,t)*H;
C.cy=Math.cos(C.yaw);C.sy=Math.sin(C.yaw);C.cp=Math.cos(C.pitch);C.sp=Math.sin(C.pitch);C.hz=H/2+C.f*Math.tan(C.pitch);
if(i!==curShot){curShot=i;showShot(i);}}

function updateWorld(dt){
if(T>nb){bt=T;nb=T+2+rnd()*3.2;}
const bp=(T-bt)/.17;S.blink=bp>=0&&bp<1?1-Math.sin(bp*PI)*.9:1;
if(T>ng){S.etx=rnd()*2-1;S.ety=rnd()*1.2-.6;ng=T+1.4+rnd()*2.4;}
let etx=S.etx,ety=S.ety;
if(car.on&&Math.abs(car.x-R.x)<18){etx=cl((car.x-R.x)/7,-1,1);ety=.15;}
if(T>nl){lt=T;nl=T+13+rnd()*10;}
const ld=T-lt;FL=ld>=0&&ld<1?Math.min(1,Math.exp(-ld*11)+(ld>.2?Math.exp(-(ld-.2)*9)*.8:0)):0;
S.sur=ld>.06&&ld<1.8?Math.min(1,(1.8-ld)*3):0;
if(S.sur>0){etx=0;ety=-.7;}
const e=Math.min(1,dt*7);S.ex=lerp(S.ex,etx,e);S.ey=lerp(S.ey,ety,e);
if(T>nh&&!S.sur){ht=T;nh=T+8+rnd()*6;}
const hp=(T-ht)/1.9;S.happy=hp>0&&hp<1?Math.min(1,Math.sin(hp*PI)*1.7):0;
const hop=S.happy?Math.abs(Math.sin((T-ht)*7.5))*.05*S.happy:0;
S.bob=Math.sin(T*2.4)*.012+hop;
S.tilt=Math.sin(T*.7)*.05+S.ex*.07+S.happy*.1*Math.sin(T*6)-S.sur*.06;
S.sway=Math.sin(T*1.1)*.035+Math.sin(T*2.3)*.012;
if(T>ntap){tapT=T;ntap=T+5+rnd()*4;}const tp=T-tapT;S.tap=tp>0&&tp<1.4?Math.max(0,Math.sin(tp*11))*.03:0;
S.ant=.5+.5*Math.sin(T*3.2);
S.side=Math.sin(Math.atan2(C.x-R.x,R.z-C.z));
U.hx=.5;U.hy=-.74+S.bob;U.tx=.1+S.sway;U.ty=-1.97+S.bob;U.rot=Math.atan2(U.tx-U.hx,U.hy-U.ty);
const sr=Math.sin(U.rot),cr=Math.cos(U.rot);U.x=R.x+U.tx-.42*sr;U.y=-(U.ty+.42*cr);
if(!car.on&&T>car.n){car.dir=rnd()<.5?1:-1;car.z=car.dir>0?11.2:15.6;car.x=R.x-car.dir*60;car.v=11+rnd()*5;car.col=CC[rnd()*CC.length|0];car.on=true;}
if(car.on){car.x+=car.dir*car.v*dt;if(car.dir*(car.x-R.x)>60){car.on=false;car.n=T+2.5+rnd()*6;}if(dt>0&&rnd()<.6)splash(car.x+(rnd()*2-1)*1.5,car.z-.3);}
fly.x+=7*dt;if(fly.x>170)fly.x=-170;
for(const q of CL){q.az+=dt*.005;if(q.az>1.6)q.az=-1.6;}
if(dt>0&&T>nd){nd=T+.07+rnd()*.22;const lx=-.78+(rnd()*7|0)*.26;parts.push({x:R.x+U.tx+lx*cr-.42*sr,y:-(U.ty+lx*sr+.42*cr),z:R.z-.08,vx:0,vy:-.2,k:0,l:3});}
if(rnd()<dt*28){const lx=(rnd()*2-1)*.65,q=lx/U.r;spray(U.x+lx,U.y+(1-q*q)*.36);}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy-=9.8*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.y<=0||p.l<=0){if(p.y<=0&&!p.k)splash(p.x,p.z);parts.splice(i,1);}}
while(SP.length&&T-SP[0].t>.38)SP.shift();
const fx=C.x+C.sy*14,fz=C.z+C.cy*14;
for(let i=0;i<NR;i++){rY[i]+=VY*rS[i]*dt;rX[i]+=VX*dt;
if(rX[i]<fx-HX)rX[i]+=2*HX;else if(rX[i]>fx+HX)rX[i]-=2*HX;
if(rZ[i]<fz-HZ)rZ[i]+=2*HZ;else if(rZ[i]>fz+HZ)rZ[i]-=2*HZ;
if(Math.abs(rZ[i]-R.z)<.45){const dx=rX[i]-U.x,q=dx*dx/(U.r*U.r);if(q<1){const top=U.y+(1-q)*.36;if(rY[i]<top&&rY[i]>U.y-.05){if(rnd()<.6)spray(rX[i],top);respawn(i,fx,fz,true);continue;}}}
if(rY[i]<0){splash(rX[i],rZ[i]);respawn(i,fx,fz,true);}}}

function sky(c,hz,M){const g=c.createLinearGradient(0,hz-H*1.1,0,hz);g.addColorStop(0,'#04050e');g.addColorStop(.5,'#0e0f2e');g.addColorStop(.82,'#221a47');g.addColorStop(1,'#3e2859');c.fillStyle=g;c.fillRect(-M,-H*.6,W+2*M,hz+H*.6+2);
const md=.3-C.yaw;if(Math.abs(md)<1.2){const x=W/2+C.f*Math.tan(md),y=H/2-C.f*Math.tan(.3-C.pitch),r=C.f*.28,mg=c.createRadialGradient(x,y,0,x,y,r);mg.addColorStop(0,'rgba(190,180,255,.22)');mg.addColorStop(1,'rgba(190,180,255,0)');c.fillStyle=mg;c.fillRect(x-r,y-r,2*r,2*r);c.fillStyle='rgba(236,232,255,.85)';c.beginPath();c.arc(x,y,C.f*.022,0,TAU);c.fill();}
for(const q of CL){const d=q.az-C.yaw;if(Math.abs(d)>1.25)continue;const x=W/2+C.f*Math.tan(d),y=H/2-C.f*Math.tan(q.el-C.pitch),r=C.f*q.s;c.save();c.translate(x,y);c.scale(1,.4);const cg=c.createRadialGradient(0,0,0,0,0,r),col=q.el<.2?'125,75,150':'72,64,135';cg.addColorStop(0,`rgba(${col},${q.a})`);cg.addColorStop(1,`rgba(${col},0)`);c.fillStyle=cg;c.fillRect(-r,-r,2*r,2*r);c.restore();}
if(FL>0){c.globalCompositeOperation='lighter';c.fillStyle=`rgba(150,160,255,${FL*.4})`;c.fillRect(-M,-H*.6,W+2*M,hz+H*.6);c.globalCompositeOperation='source-over';}}

function ground(c,hz,M){const g=c.createLinearGradient(0,hz,0,H+M*.2);g.addColorStop(0,'#2b2148');g.addColorStop(.2,'#16142c');g.addColorStop(1,'#07070e');c.fillStyle=g;c.fillRect(-M,hz-1,W+2*M,H-hz+M+2);
const zn=C.z-12;
c.fillStyle='rgba(58,54,96,.35)';c.beginPath();gq(c,-90,zn,90,7);c.fill();
c.strokeStyle='rgba(150,140,210,.09)';c.lineWidth=D;c.beginPath();for(let z=-7;z<7;z+=1.4)seg(c,-40,0,z,40,0,z);for(let x=-14;x<=14;x+=1.4)seg(c,x,0,zn,x,0,7);c.stroke();
c.fillStyle='rgba(160,150,215,.22)';c.beginPath();gq(c,-90,7,90,7.22);gq(c,-90,19,90,19.18);c.fill();
c.fillStyle='rgba(4,4,12,.45)';c.beginPath();gq(c,-90,7.22,90,19);c.fill();
c.fillStyle='rgba(215,220,255,.13)';c.beginPath();for(let i=0;i<7;i++){const x=-2.1+i*.62;gq(c,x,7.6,x+.36,18.6);}c.fill();

function rshadow(c){if(!P(R.x,0,R.z))return;const r=.5*pk,f=cl(C.y/pz,.08,1);c.save();c.translate(px,py);c.scale(1,f);const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();c.restore();}

function splashes(c){c.lineWidth=D;for(let pass=0;pass<2;pass++){c.beginPath();for(let i=0;i<SP.length;i++){const s=SP[i],a=(T-s.t)/.38;if(a<0||a>1||(pass===0)!==(a<.5))continue;if(!P(s.x,0,s.z))continue;const r=(.03+a*.14)*pk,ry=r*cl(C.y/pz,.1,1);c.moveTo(px+r,py);c.ellipse(px,py,r,ry,0,0,TAU);}c.strokeStyle=pass?'rgba(190,205,255,.18)':'rgba(195,210,255,.42)';c.stroke();}
c.fillStyle='rgba(205,218,255,.5)';c.beginPath();for(const s of SP){const a=(T-s.t)/.38;if(a<0||a>.6||!P(s.x,0,s.z))continue;const h=Math.sin(a/.6*PI)*.07*pk,w=(.03+a*.1)*pk,q=Math.max(.6*D,.008*pk);c.moveTo(px-w+q,py-h);c.arc(px-w,py-h,q,0,TAU);c.moveTo(px+w+q,py-h*.8);c.arc(px+w,py-h*.8,q,0,TAU);}c.fill();}
function partsDraw(c){c.fillStyle='rgba(200,220,255,.75)';c.beginPath();for(const p of parts){if(!P(p.x,p.y,p.z))continue;const r=Math.max(.7*D,(p.k?.01:.016)*pk);c.moveTo(px+r,py);c.arc(px,py,r,0,TAU);}c.fill();}

const BK=[[],[],[],[],[]],BF=[[],[],[],[],[]];
const RS=[['rgba(170,190,255,.2)',2.4],['rgba(175,195,255,.3)',1.5],['rgba(170,190,250,.26)',1.05],['rgba(160,180,240,.18)',.75],['rgba(255,214,160,.6)',1.25]];
function rainBuild(){for(let b=0;b<5;b++){BK[b].length=0;BF[b].length=0;}const L=.032;
for(let i=0;i<NR;i++){const x=rX[i],y=rY[i],z=rZ[i];if(!P(x,y,z))continue;if(px<-60||px>W+60||py<-80||py>H+60)continue;const hx=px,hy=py,d=pz;if(!P(x-VX*L,y-VY*L*rS[i],z))continue;
let b=d<2.5?0:d<6?1:d<13?2:3;
for(let j=0;j<LAMPS.length;j++){const l=LAMPS[j];if(Math.abs(z-l.z)<1.6&&y<l.hy&&Math.abs(x-l.hx)<(l.hy-y)*.45+.2){b=4;break;}}
(z>R.z+.3?BK:BF)[b].push(hx,hy,px,py);}}
function rainDraw(c,A){for(let b=0;b<5;b++){const a=A[b];if(!a.length)continue;c.beginPath();for(let j=0;j<a.length;j+=4){c.moveTo(a[j],a[j+1]);c.lineTo(a[j+2],a[j+3]);}c.strokeStyle=RS[b][0];c.lineWidth=RS[b][1]*D;c.stroke();}}

function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function buildRefl(){const c=rcx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';
for(const s of SIGNS){if(!sOn(s))continue;if(!P(s.x,-s.y,s.z))continue;const ax=px,ay=py;if(!P(s.x+s.w,-(s.y+s.h),s.z))continue;const bx=px,by=py;if(bx<-40||ax>W+40||ay>H)continue;const h=by-ay,w=bx-ax;c.fillStyle=`rgba(${s.rgb},.5)`;c.fillRect(ax,ay,w,h);const g=c.createLinearGradient(0,ay,0,ay+h*3);g.addColorStop(0,`rgba(${s.rgb},.28)`);g.addColorStop(1,`rgba(${s.rgb},0)`);c.fillStyle=g;c.fillRect(ax-w*.1,ay,w*1.2,h*3);}
c.fillStyle='rgba(255,175,105,.22)';for(const b of LAYERS[3].b){if(!b.shop)continue;if(!P(b.x+b.w*.1,-.3,b.z))continue;const ax=px,ay=py;if(!P(b.x+b.w*.9,-2.3,b.z))continue;if(px<-20||ax>W+20)continue;c.fillRect(ax,ay,px-ax,py-ay);}
for(const l of LAMPS){if(P(l.hx,-l.hy,l.z))glow(c,px,py,1.6*pk,'255,205,140',.55);}
if(car.on){if(P(car.x+car.dir*2.1,-.62,car.z))glow(c,px,py,.9*pk,'255,245,220',.6);if(P(car.x-car.dir*2.12,-.66,car.z))glow(c,px,py,.8*pk,'255,50,80',.55);}
c.globalCompositeOperation='source-over';c.globalAlpha=.45;robotAt(c,true);c.globalAlpha=1;}

function fg(c){const x=-3.3,z=3.2;c.fillStyle='#05050b';c.beginPath();if(poly(c,[[x-.07,0,z],[x+.07,0,z],[x+.07,2.9,z],[x-.07,2.9,z]]))c.fill();
c.beginPath();if(poly(c,[[x-.5,2.3,z-.03],[x+.5,2.3,z-.03],[x+.5,2.95,z-.03],[x-.5,2.95,z-.03]])){c.fillStyle='#0c1630';c.fill();c.strokeStyle='rgba(61,242,255,.5)';c.lineWidth=1.2*D;c.stroke();}
c.beginPath();seg(c,x-.3,2.62,z-.04,x+.28,2.62,z-.04);seg(c,x+.28,2.62,z-.04,x+.12,2.76,z-.04);seg(c,x+.28,2.62,z-.04,x+.12,2.48,z-.04);c.strokeStyle='rgba(61,242,255,.8)';c.lineWidth=1.4*D;c.stroke();
c.beginPath();seg(c,x+.07,0,z,x+.07,2.3,z);c.strokeStyle='rgba(255,79,163,.4)';c.lineWidth=1.2*D;c.stroke();}

function post(c){c.setTransform(1,0,0,1,0,0);if(FL>0){c.globalCompositeOperation='screen';c.fillStyle=`rgba(190,200,255,${FL*.22})`;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';}
c.fillStyle=vig;c.fillRect(0,0,W,H);c.save();c.globalAlpha=.04;c.fillStyle=grainP;c.translate(rnd()*128|0,rnd()*128|0);c.fillRect(-128,-128,W+256,H+256);c.restore();
const bh=Math.round(H*.055);c.fillStyle='#000';c.fillRect(0,0,W,bh);c.fillRect(0,H-bh,W,bh);}

function render(){rainBuild();buildRefl();
const c=ctx;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.shadowBlur=0;c.fillStyle='#05060f';c.fillRect(0,0,W,H);
c.save();c.translate(W/2,H/2);c.rotate(C.roll);c.translate(-W/2,-H/2);
const hz=C.hz,M=W*.3;
sky(c,hz,M);ground(c,hz,M);
c.globalCompositeOperation='lighter';c.globalAlpha=.62;
const y0=Math.max(0,Math.floor(hz)),st=Math.max(2,Math.round(2*D));
for(let y=y0;y<H;y+=st){const h=Math.min(st,H-y),o=Math.sin(y/D*.09+T*2.4)*(.6+(y-y0)/H*5)*D;c.drawImage(rc,0,y,W,h,o,y,W,h);}
c.globalAlpha=1;c.globalCompositeOperation='source-over';
ANT.length=0;
layer(c,0);fog(c,hz,.34);layer(c,1);fog(c,hz,.26);lights(c);
layer(c,2);signs(c,2);fog(c,hz,.16);sheet(c,1,.1,560);
layer(c,3);signs(c,3);fog(c,hz,.07);
lamp(c,LAMPS[1]);lamp(c,LAMPS[2]);drawCar(c);
rainDraw(c,BK);splashes(c);
lamp(c,LAMPS[3]);lamp(c,LAMPS[0]);
rshadow(c);robotAt(c,false);partsDraw(c);
rainDraw(c,BF);sheet(c,2.3,.05,1400);fg(c);
c.restore();post(c);}

function frame(dt){T+=dt;camT+=dt;updateCam(dt);updateWorld(dt);render();}
function loop(ts){if(!running||!visible){looping=false;last=null;return;}if(last===null)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;frame(dt);requestAnimationFrame(loop);}
function kick(){if(!looping&&running&&visible){looping=true;last=null;requestAnimationFrame(loop);}}
function resize(){const w=box.clientWidth||680;D=Math.min(window.devicePixelRatio||1,1.75);W=Math.max(320,Math.round(w*D));H=Math.round(W*9/16);cv.width=rc.width=W;cv.height=rc.height=H;vig=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.75);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.6)');if(!running||!visible){updateCam(0);render();}}

resize();updateCam(0);{const fx=C.x+C.sy*14,fz=C.z+C.cy*14;for(let i=0;i<NR;i++)respawn(i,fx,fz,false);}updateWorld(0);
new ResizeObserver(()=>resize()).observe(box);
new IntersectionObserver(es=>{visible=es[0].isIntersecting;kick();}).observe(box);
const pp=document.getElementById('pp'),ppt=document.getElementById('ppt');
pp.addEventListener('click',()=>{running=!running;ppt.textContent=running?'Pause':'Play';pp.setAttribute('aria-label',running?'Pause animation':'Play animation');kick();});
document.getElementById('nx').addEventListener('click',()=>{camT=(Math.floor(camT/SEG)+1)*SEG+.01;if(!running){updateCam(0);render();}});
box.addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();ptr.tx=((e.clientX-r.left)/r.width-.5)*2;ptr.ty=((e.clientY-r.top)/r.height-.5)*2;});
box.addEventListener('pointerleave',()=>{ptr.tx=0;ptr.ty=0;});
kick();
})();
</script>
</body>

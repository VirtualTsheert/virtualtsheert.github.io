<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VirtualTsheert — AR Viewer</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{
    --bg: #0B0E1A;
    --text: #ECE9FF;
    --muted: #8891B5;
    --cyan: #6EE7F9;
    --magenta: #FF5FD8;
  }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  #top-bar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 16px;
    pointer-events:none;
  }

  #back-btn{
    pointer-events:auto;
    background: rgba(11,14,26,0.75);
    color: var(--text);
    border: 1px solid rgba(110,231,249,0.45);
    font-family: monospace;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 8px 14px;
    cursor:pointer;
    backdrop-filter: blur(6px);
  }

  #product-tag{
    pointer-events:auto;
    background: rgba(11,14,26,0.75);
    color: var(--cyan);
    border: 1px solid rgba(110,231,249,0.45);
    font-family: monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    max-width: 55%;
    text-align:right;
    backdrop-filter: blur(6px);
    text-transform: uppercase;
  }

  #hint{
    position:fixed;
    bottom: 24px; left:50%;
    transform: translateX(-50%);
    z-index:1000;
    background: rgba(11,14,26,0.75);
    border: 1px solid rgba(255,95,216,0.4);
    color: var(--text);
    font-family: monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 10px 18px;
    text-align:center;
    backdrop-filter: blur(6px);
    max-width: 90%;
    transition: opacity 0.3s ease;
  }
  #hint.hide{ opacity:0; pointer-events:none; }

  #loading, #error{
    position:fixed; inset:0; z-index:2000;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    background: var(--bg); color: var(--text);
    font-family: monospace;
    text-align:center;
    padding: 24px;
  }
  #error{ display:none; }

  .dot-pulse{
    width:10px; height:10px; border-radius:50%;
    background: var(--cyan);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(110,231,249,0.55); }
    70%{ box-shadow: 0 0 0 14px rgba(110,231,249,0); }
    100%{ box-shadow: 0 0 0 0 rgba(110,231,249,0); }
  }

  .small{ font-size:0.68rem; color: var(--muted); letter-spacing:0.05em; }

  #err-btn{
    margin-top:8px;
    background: linear-gradient(120deg, var(--cyan), var(--magenta));
    color: #0B0E1A;
    border:none;
    font-family: 'Segoe UI', sans-serif;
    font-weight:600;
    font-size:0.8rem;
    padding: 10px 18px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="top-bar">
  <button id="back-btn" onclick="goBack()">← Kembali</button>
  <div id="product-tag">Produk</div>
</div>

<div id="hint">◆ Arahkan kamera ke penanda / marker produk</div>

<div id="loading">
  <div class="dot-pulse"></div>
  <div>Menyiapkan kamera AR...</div>
  <div class="small">Izinkan akses kamera saat diminta</div>
</div>

<div id="error">
  <div>Target AR belum tersedia</div>
  <div class="small">Parameter link produk ini belum diisi (target / model)</div>
  <button id="err-btn" onclick="goBack()">Kembali ke katalog</button>
</div>

<div id="ar-root"></div>

<script>
  function goBack(){
    if (document.referrer) {
      window.location.href = document.referrer;
    } else {
      window.location.href = 'index.html';
    }
  }

  const params   = new URLSearchParams(window.location.search);
  const target   = params.get('target');
  const index    = params.get('index') || '0';
  const model    = params.get('model');
  const scale    = params.get('scale') || '10 10 10';
  const pos      = params.get('pos')   || '0 -0.6 0';
  const rot      = params.get('rot')   || '0 0 0';
  const anim     = params.get('anim')  || '';
  const name     = params.get('name')  || 'Produk';

  document.getElementById('product-tag').textContent = name;

  if (!target || !model) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'flex';
  } else {
    const animAttr = anim ? ` animation-mixer="clip: ${anim}"` : ' animation-mixer';

    const sceneHTML = `
      <a-scene
        mindar-image="imageTargetSrc: ${target}; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.0001;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">
        <a-assets>
          <a-asset-item id="productModel" src="${model}"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: ${index}">
          <a-gltf-model
            rotation="${rot}"
            position="${pos}"
            scale="${scale}"
            smooth-follow
            src="#productModel"${animAttr}>
          </a-gltf-model>
        </a-entity>
      </a-scene>
    `;

    document.getElementById('ar-root').innerHTML = sceneHTML;

    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener('renderstart', () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 600);
    });

    // fallback kalau event renderstart tidak terpicu
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 4000);

    const targetEntity = document.querySelector('[mindar-image-target]');
    if (targetEntity) {
      targetEntity.addEventListener('targetFound', () => {
        document.getElementById('hint').classList.add('hide');
      });
      targetEntity.addEventListener('targetLost', () => {
        document.getElementById('hint').classList.remove('hide');
      });
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet Elyra – Episode 01</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#10142a;color:#d6dbf5;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
canvas{width:min(92vw,calc(78vh*9/16));height:auto;border-radius:14px;background:#000;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:#232848;color:#fff;border:1px solid #3d4470;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
button.rec{background:#c62842;border-color:#e0405a}
button:disabled{opacity:.5;cursor:default}
#st{font-size:14px;min-height:20px;text-align:center;max-width:520px}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="rec" class="rec">● Rekam video (60 detik)</button>
  <button id="rp">Putar ulang</button>
  <button id="pa">Jeda</button>
  <button id="snd">Suara: ON</button>
</div>
<div id="st">Klik "Putar ulang" untuk menonton dengan suara. Klik "Rekam video", tunggu 60 detik, file akan terunduh otomatis.</div>
<script>
(()=>{
// =====================================================================
// PLANET ELYRA — EPISODE 01 "PLANET TAK BERNAMA" — Canvas 2D, 60 detik
// =====================================================================
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1080,H=1920,PI=Math.PI,TAU=PI*2;
const st=document.getElementById('st'),DUR=60;
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=cl(x,0,1);return x*x*(3-2*x);};
const eo=x=>{x=cl(x,0,1);return 1-Math.pow(1-x,3);};
const eb=x=>{x=cl(x,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const win=(t,a,b,fi=.35,fo=.35)=>Math.min(sm((t-a)/fi),1-sm((t-(b-fo))/fo));
function keys(arr,t){
  if(t<=arr[0][0])return arr[0].slice(1);
  for(let i=0;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];if(t<=b[0]){const k=sm((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],k));}}
  return arr[arr.length-1].slice(1);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);}
function glow(x,y,r,col,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,col.replace(/,\s*[\d.]+\)$/,',0)'));ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}

// ------------------------------- TIMELINE -----------------------------
const VO=[
 [0.3,3.2,"Tiga ratus hari aku mengikuti sinyal ini..."],
 [3.4,6.0,"...dan ujungnya, sebuah planet tanpa nama."],
 [7.3,9.2,"Oke... tarik napas dulu."],
 [9.7,11.6,"Langkah pertama manusia di sini."],
 [11.8,14.8,"Danau seluas lautan, pulau melayang, dan... kosong."],
 [14.9,16.3,"Kunamai dia... Elyra."],
 [16.4,17.9,"Lalu aku kepikiran..."],
 [18.1,20.7,"Bagaimana kalau aku dirikan sebuah... NEGARA?"],
 [20.9,22.2,"Negara sungguhan. Serius."],
 [22.4,25.3,"Masalahnya, negara butuh rakyat. Bukan cuma satu orang."],
 [25.6,28.4,"Makanya alat ini kubawa jauh-jauh dari rumah."],
 [28.7,30.7,"Portal... menuju Bumi."],
 [31.6,34.2,"Pintunya terbuka. Siapa pun boleh ikut pindah."],
 [34.5,35.8,"Tapi tunggu dulu."],
 [37.6,39.9,"Jumlah penduduk negara ini... satu."],
 [40.3,43.1,"Ya, aku. Nggak ada rumah, nggak ada kota."],
 [43.2,45.0,"Karena itu, aku butuh kamu."],
 [45.1,47.9,"Follow sekarang, dan jadilah penduduk pertama Elyra."],
 [48.2,49.2,"Rumah?"],
 [49.4,50.3,"Markas negara?"],
 [50.4,52.2,"Atau sesuatu yang lebih gila?"],
 [52.4,54.9,"Kamu yang menentukan, lewat komentar."],
 [55.2,57.9,"Komentar teratas akan kubangun di episode berikutnya."],
 [58.1,59.2,"Sampai jumpa... di Elyra."],
];
const B={touchdown:6.2,doorOpen:6.9,footStep:9.5,holoOn:16.2,morph:19.7,deviceDown:23.3,legsOut:23.7,ringsLift:24.4,surface:29,online:31,musicStop:35.9,stats:37.4,whip:40,grid:43.3,bp:[44.9,45.4,45.9],choice:[48.3,49.5,50.5],lines:52.6,foundation:56.2,black:59.25};

// ------------------------------- WORLD --------------------------------
const PY=1480, GY=1500;           // pivot & ground line (feet)
const SHIP_S=1.8, PORTAL={x:820,y:GY-245,R:165}, PLOTS=[{x:300},{x:520},{x:740}], PLOT_Y=1625;
const R0=rng(7);
const STARS=[...Array(170)].map(()=>({x:R0()*W,y:R0()*H,r:.6+R0()*2.2,p:R0()*TAU}));
const FAR=[],NEAR=[];
{const r=rng(11);for(let x=-2700;x<=3300;x+=250)FAR.push({x:x+r()*80,h:250+r()*190,w:200+r()*90});}
{const r=rng(23);for(let x=-2600;x<=3300;x+=330)NEAR.push({x:x+r()*120,h:150+r()*130,w:230+r()*90});}
const CLOUDS=[...Array(9)].map((_, i)=>{const r=rng(40+i);return{x:-1400+i*420+r()*160,y:260+r()*420,s:.7+r()*.6};});
const ISLES=[{x:-640,y:560,r:95,falls:1,ph:0},{x:330,y:470,r:135,falls:1,ph:1.7},{x:880,y:640,r:70,falls:0,ph:3.1},{x:-180,y:400,r:52,falls:0,ph:4.4},{x:1350,y:440,r:100,falls:1,ph:2.3}];
const CONT=[];{const r=rng(5);for(let i=0;i<7;i++){const c={lon:r()*TAU,lat:(r()-.5)*1.6,rad:.22+r()*.28,k:[]};for(let j=0;j<12;j++)c.k.push(.65+r()*.5);CONT.push(c);}}
const EARTH=[{lon:.3,lat:.5,rad:.45},{lon:1.4,lat:.2,rad:.38},{lon:2.6,lat:-.4,rad:.3},{lon:4.2,lat:.3,rad:.5},{lon:5.3,lat:-.5,rad:.28}].map((c,i)=>{const r=rng(90+i);c.k=[...Array(12)].map(()=>.6+r()*.55);return c;});

// ------------------------------- CAMERA -------------------------------
// [t, camX, camY(-=lihat ke atas), zoom]
const CAM=[[5.0,0,-430,.8],[6.4,0,-90,.95],[7.4,150,-60,1.1],[9.4,320,-40,1.3],[11.4,420,-40,1.3],[13.0,300,-270,.66],[15.2,300,-270,.66],[15.8,520,-95,1.6],[21.6,520,-95,1.6],[23.3,720,-120,1.15],[28.5,770,-170,.98],[34,770,-170,.98],[35.6,700,-80,1.3],[39.9,680,-80,1.36],[40.35,300,-300,.6],[43,300,-300,.6],[44.2,560,40,.86],[55,560,40,.86],[57.8,525,95,1.3],[60,520,100,1.36]];
const ASTRO=[[7.4,191,-151],[9.3,360,0],[9.5,400,0],[11.4,480,0],[21.8,480,0],[23.0,650,0],[60,650,0]];
let cam={x:0,y:0,z:1};
function layer(p,fn){const s=1+(cam.z-1)*p;ctx.save();ctx.setTransform(s,0,0,s,540-s*cam.x*p,PY-s*PY-s*cam.y*p);fn(s);ctx.restore();}
function toScreen(p,x,y){const s=1+(cam.z-1)*p;return[540+s*(x-cam.x*p),PY+s*(y-PY-cam.y*p),s];}

// ------------------------------- SPACE (0–5.6) ------------------------
function project(cx,cy,R,lon,lat,rot){const a=lon+rot;return{x:cx+R*Math.cos(lat)*Math.sin(a),y:cy-R*Math.sin(lat),z:Math.cos(lat)*Math.cos(a)};}
function drawBlobs(cx,cy,R,rot,list,fill,edge){
  for(const c of list){const cc=project(cx,cy,R,c.lon,c.lat,rot);if(cc.z<-.15)continue;
    ctx.beginPath();for(let j=0;j<12;j++){const an=j/12*TAU,rk=c.rad*c.k[j];const p=project(cx,cy,R,c.lon+Math.cos(an)*rk/Math.max(.35,Math.cos(c.lat)),c.lat+Math.sin(an)*rk*.8,rot);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.closePath();
    if(edge){ctx.strokeStyle=edge;ctx.lineWidth=R*.025;ctx.lineJoin='round';ctx.stroke();}ctx.fillStyle=fill;ctx.fill();}
}
function ring(cx,cy,R,half,a=1){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.32);ctx.globalAlpha=a;
  const bands=[[2.25,.10,'rgba(255,214,190,.75)'],[1.95,.12,'rgba(214,196,255,.8)'],[1.66,.08,'rgba(190,240,255,.7)']];
  for(const[k,w,c]of bands){ctx.beginPath();ctx.ellipse(0,0,R*k,R*k*.22,0,half?0:PI,half?PI:TAU);ctx.strokeStyle=c;ctx.lineWidth=R*w;ctx.stroke();}
  ctx.restore();ctx.globalAlpha=1;
}
function drawPlanet(cx,cy,R,rot){
  glow(cx,cy,R*1.25,'rgba(190,245,255,.9)',.55);
  ring(cx,cy,R,0);
  ctx.save();circ(cx,cy,R);ctx.clip();
  const g=ctx.createRadialGradient(cx-R*.4,cy-R*.45,R*.05,cx,cy,R);
  g.addColorStop(0,'#b9fbff');g.addColorStop(.45,'#4fd6e0');g.addColorStop(1,'#2a93c9');ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,R*2,R*2);
  drawBlobs(cx,cy,R,rot,CONT,'#9fe58e','#f7ecb5');
  drawBlobs(cx,cy,R*.985,rot*1.4+1,CONT.slice(0,4).map(c=>({...c,lat:c.lat+.25,rad:c.rad*.55})),'rgba(255,255,255,.75)');
  const sh=ctx.createRadialGradient(cx-R*.5,cy-R*.5,R*.4,cx-R*.2,cy-R*.2,R*1.5);
  sh.addColorStop(0,'rgba(60,50,140,0)');sh.addColorStop(1,'rgba(60,50,140,.42)');ctx.fillStyle=sh;ctx.fillRect(cx-R,cy-R,R*2,R*2);
  ctx.restore();
  ctx.strokeStyle='rgba(220,252,255,.8)';ctx.lineWidth=R*.03;circ(cx,cy,R*.99);ctx.stroke();
  ring(cx,cy,R,1);
}
function drawSpace(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b3a8f');g.addColorStop(.55,'#5b74cf');g.addColorStop(1,'#a9c4f5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  glow(220,520,560,'rgba(255,160,220,.55)',.7);glow(900,1350,640,'rgba(130,245,230,.5)',.7);glow(700,200,400,'rgba(200,170,255,.6)',.6);
  for(const s of STARS){ctx.globalAlpha=.5+.5*Math.sin(t*3+s.p);ctx.fillStyle='#fff';circ(s.x,s.y,s.r);ctx.fill();}ctx.globalAlpha=1;
  const k=Math.pow(cl(t/5.4,0,1),1.7),R=320*Math.exp(2.25*k),kk=sm(t/5.4);
  const cx=lerp(560,540+.3*R,kk),cy=lerp(860,900+.28*R,kk);
  // bulan kecil
  const m=1+k*2;ctx.fillStyle='#efe9ff';circ(160-k*300,330-k*200,42*m);ctx.fill();ctx.fillStyle='rgba(150,140,210,.35)';circ(172-k*300,342-k*200,40*m);ctx.fill();
  ctx.fillStyle='#d4fbf6';circ(930+k*300,1520+k*300,22*m);ctx.fill();
  drawPlanet(cx,cy,R,t*.09);
  // kapal mendekat
  const p=sm(t/4.8),sx=lerp(170,520,p),sy=lerp(1750,980,p),ss=lerp(.75,.08,eo(t/4.8));
  if(t<4.9){ctx.save();ctx.translate(sx,sy);ctx.rotate(-.75+p*.4);
    const tr=ctx.createLinearGradient(0,0,0,700*ss);tr.addColorStop(0,'rgba(255,240,200,.8)');tr.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=tr;ctx.beginPath();ctx.moveTo(-50*ss,0);ctx.lineTo(50*ss,0);ctx.lineTo(0,900*ss);ctx.fill();
    ctx.rotate(PI/2);ctx.scale(ss,ss);ctx.translate(0,128);drawShip(t,1,0,0);ctx.restore();}
}

// ------------------------------- SURFACE ------------------------------
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4aaef2');g.addColorStop(.33,'#94d6ff');g.addColorStop(.52,'#d9f2ff');g.addColorStop(.68,'#fff0db');g.addColorStop(1,'#ffe3c4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ox=-cam.x*.03,oy=-cam.y*.05;
  glow(190+ox,320+oy,420,'rgba(255,250,225,1)',.9);ctx.fillStyle='#fffbe9';circ(190+ox,320+oy,62);ctx.fill();
  // planet bercincin di langit
  const px=830+ox*1.3,py=360+oy;
  ring(px,py,120,0,.7);
  const pg=ctx.createRadialGradient(px-40,py-40,10,px,py,120);pg.addColorStop(0,'#f4ecff');pg.addColorStop(1,'#bcaee6');ctx.fillStyle=pg;circ(px,py,120);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ell(px-10,py-30,90,14,-.32);ctx.fill();ell(px+8,py+25,80,10,-.32);ctx.fill();
  ring(px,py,120,1,.7);
  ctx.fillStyle='#e6fffb';circ(620+ox*1.2,230+oy,26);ctx.fill();
}
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.92)';for(const[a,b,r]of[[-70,10,46],[-20,-14,62],[40,0,52],[85,14,36],[0,20,44]]){circ(x+a*s,y+b*s,r*s);ctx.fill();}
  ctx.fillStyle='rgba(205,225,255,.5)';rr(x-110*s,y+20*s,220*s,24*s,12*s);ctx.fill();}
function peak(x,base,h,w,lit,shade,snow){
  ctx.fillStyle=lit;ctx.beginPath();ctx.moveTo(x-w,base);ctx.lineTo(x,base-h);ctx.lineTo(x+w*.1,base);ctx.fill();
  ctx.fillStyle=shade;ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x+w,base);ctx.lineTo(x+w*.1-1,base);ctx.fill();
  if(snow){const k=.3;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(x-w*k,base-h*(1-k));ctx.lineTo(x,base-h);ctx.lineTo(x+w*k,base-h*(1-k));ctx.lineTo(x+w*k*.4,base-h*(1-k)+14);ctx.lineTo(x,base-h*(1-k)-4);ctx.lineTo(x-w*k*.5,base-h*(1-k)+12);ctx.fill();
    ctx.fillStyle='#e3e6ff';ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x+w*k,base-h*(1-k));ctx.lineTo(x+w*k*.4,base-h*(1-k)+14);ctx.lineTo(x,base-h*(1-k)-4);ctx.fill();}
}
function isle(I,t){
  const y=I.y+Math.sin(t*.8+I.ph)*10,x=I.x,r=I.r;
  if(I.falls){const fg=ctx.createLinearGradient(0,y,0,y+r*4.2);fg.addColorStop(0,'rgba(235,255,255,.95)');fg.addColorStop(1,'rgba(235,255,255,0)');ctx.fillStyle=fg;ctx.fillRect(x+r*.35,y+r*.1,r*.18,r*4.2);
    ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<4;i++){const yy=y+((t*160+i*r)%(r*3.5));ctx.fillRect(x+r*.37,yy,r*.05,r*.4);}}
  ctx.fillStyle='#e3c2a6';ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x-r*.15,y+r*1.5);ctx.lineTo(x,y);ctx.fill();
  ctx.fillStyle='#c39d84';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-r*.15,y+r*1.5);ctx.lineTo(x+r,y);ctx.fill();
  ctx.fillStyle='#9fe58e';ell(x,y,r,r*.28);ctx.fill();ctx.fillStyle='#c4f3a6';ell(x-r*.15,y-r*.06,r*.7,r*.15);ctx.fill();
}
function tree(x,y,s){
  ctx.fillStyle='#c79a78';rr(x-7*s,y-60*s,14*s,60*s,5*s);ctx.fill();
  ctx.fillStyle='#62c48c';circ(x,y-92*s,46*s);ctx.fill();
  ctx.fillStyle='#86dca0';ctx.beginPath();ctx.arc(x,y-92*s,46*s,PI*.6,PI*1.6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';circ(x-16*s,y-110*s,10*s);ctx.fill();
}
function gate(x,y){
  const st='#efdcc9',sh='#d4b8a0';
  ctx.fillStyle=sh;ctx.beginPath();ctx.moveTo(x-90,y);ctx.lineTo(x-80,y-120);ctx.quadraticCurveTo(x,y-210,x+80,y-120);ctx.lineTo(x+90,y);ctx.lineTo(x+52,y);ctx.lineTo(x+48,y-110);ctx.quadraticCurveTo(x,y-160,x-48,y-110);ctx.lineTo(x-52,y);ctx.closePath();ctx.fill();
  ctx.fillStyle=st;ctx.beginPath();ctx.moveTo(x-90,y);ctx.lineTo(x-80,y-120);ctx.quadraticCurveTo(x-30,y-190,x+10,y-180);ctx.lineTo(x+8,y-150);ctx.quadraticCurveTo(x-30,y-150,x-48,y-110);ctx.lineTo(x-52,y);ctx.closePath();ctx.fill();
}
function drawWorld(t){
  drawSky(t);
  layer(.08,()=>{for(const c of CLOUDS)cloud(c.x+t*9,c.y,c.s);});
  layer(.18,()=>{ctx.fillStyle='#c2b4ec';ctx.fillRect(-3000,1088,7000,400);for(const p of FAR)peak(p.x,1090,p.h,p.w,'#ddd3f7','#c2b4ec',p.h>360);});
  layer(.26,()=>{ctx.fillStyle='#a28fe0';ctx.fillRect(-3000,1098,7000,400);for(const p of NEAR)peak(p.x,1100,p.h,p.w,'#bfaef0','#a28fe0',p.h>230);});
  layer(.33,()=>{for(const I of ISLES)isle(I,t);});
  layer(.5,()=>{
    ctx.fillStyle='#b8ea9e';ctx.fillRect(-3000,1088,7000,20);
    const g=ctx.createLinearGradient(0,1100,0,1500);g.addColorStop(0,'#c9f6f6');g.addColorStop(.4,'#79dbe4');g.addColorStop(1,'#3fb8d0');ctx.fillStyle=g;ctx.fillRect(-3000,1104,7000,700);
    ctx.fillStyle='rgba(255,255,255,.7)';const r=rng(3);
    for(let i=0;i<60;i++){const x=-1600+r()*3800,y=1120+r()*200,w=20+r()*50;ctx.globalAlpha=.35+.35*Math.sin(t*2+i);ctx.fillRect(x+Math.sin(t+i)*10,y,w,3);}ctx.globalAlpha=1;
  });
  layer(.62,()=>{gate(-300,1235);});
  layer(.72,()=>{
    ctx.fillStyle='#b5eb9b';ctx.beginPath();ctx.moveTo(-3000,1250);for(let x=-3000;x<=4000;x+=100)ctx.lineTo(x,1238+Math.sin(x*.004)*10);ctx.lineTo(4000,3500);ctx.lineTo(-3000,3500);ctx.fill();
    ctx.fillStyle='#a3e28f';ctx.fillRect(-3000,1262,7000,6);
    tree(-560,1262,.95);tree(1080,1262,1.05);tree(1190,1268,.8);
    for(const[x,s]of[[-470,.8],[980,.7]]){ctx.fillStyle='#7fd49a';circ(x,1255,26*s);ctx.fill();circ(x+24*s,1260,20*s);ctx.fill();}
  });
  layer(1,()=>{
    const g=ctx.createLinearGradient(0,1330,0,2100);g.addColorStop(0,'#cff7ad');g.addColorStop(.35,'#a8e793');g.addColorStop(1,'#8ad485');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-3000,1345);for(let x=-3000;x<=4000;x+=100)ctx.lineTo(x,1340+Math.sin(x*.003+1)*14);ctx.lineTo(4000,3600);ctx.lineTo(-3000,3600);ctx.fill();
    // jalur batu rapi
    ctx.fillStyle='rgba(255,250,235,.85)';for(let i=0;i<7;i++){const x=290+i*70;ell(x,GY+8+Math.sin(i)*3,24,8);ctx.fill();}
    // landasan
    ctx.fillStyle='#ece7f5';ell(0,GY+4,250,44);ctx.fill();ctx.strokeStyle='#d3cae8';ctx.lineWidth=6;ell(0,GY+4,200,34);ctx.stroke();
    ctx.fillStyle='#f2852f';for(let i=0;i<8;i++){const a=i/8*TAU;circ(Math.cos(a)*226,GY+4+Math.sin(a)*40,6);ctx.fill();}
    // rumput & bunga sedikit

    ctx.save();ctx.globalAlpha=a;ctx.translate(540,250+i*125);ctx.scale(s,s);ctx.fillStyle=on?'#ffd23f':'rgba(255,255,255,.92)';rr(-300,-50,600,100,50);ctx.fill();
    ctx.font=`900 56px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#2a3170';ctx.fillText(txt,0,3);ctx.restore();});}}
  hero('KAMU YANG MENENTUKAN',52.4,55.0,330);
  {const{a,s}=pop(t,56.0,60.2);if(a>0){ctx.save();ctx.globalAlpha=a;ctx.translate(540,380);ctx.scale(s,s);
    bigText('APA YANG KITA',0,-60,96,'#ffffff','rgba(36,48,120,.6)');bigText('BANGUN DULU?',0,60,110,'#ffd23f','rgba(36,48,120,.65)');
    ctx.translate(0,190);ctx.fillStyle='#fff';rr(-170,-44,340,88,44);ctx.fill();ctx.beginPath();ctx.moveTo(-120,40);ctx.lineTo(-140,74);ctx.lineTo(-90,40);ctx.fill();
    ctx.fillStyle='#2a3170';ctx.font=`800 34px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Tulis di komentar',0,0);ctx.restore();}}
}
function drawLabels(t){
  const L=[[.5,0,1170,'AZURE EXPANSE',12.4],[.18,320,820,'VIOLET CROWN',12.8],[.33,330,450,'DRIFTING ISLES',13.2],[.62,-300,1080,'THE FIRST GATE',13.6]];
  for(const[p,x,y,txt,at]of L){const a=win(t,at,15.1,.3,.3);if(a<=0)continue;const[sx,sy]=toScreen(p,x,y),s=eb((t-at)/.4);
    ctx.save();ctx.globalAlpha=a;ctx.translate(sx,sy);ctx.fillStyle='#fff';circ(0,0,9);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-60*s);ctx.stroke();
    ctx.font=`800 30px ${FONT}`;setLS(3);const w=ctx.measureText(txt).width+40;ctx.translate(0,-60*s);ctx.scale(s,s);ctx.fillStyle='rgba(255,255,255,.95)';rr(-w/2,-46,w,46,23);ctx.fill();
    ctx.fillStyle='#2a3170';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,-22);setLS(0);ctx.restore();}
}
function drawSubs(t){
  for(const[a,b,txt]of VO){if(t<a||t>b+.15)continue;const al=win(t,a,b+.15,.12,.15);
    ctx.save();ctx.globalAlpha=al;ctx.font=`700 42px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    const words=txt.split(' '),lines=[];let cur='';for(const w of words){const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>880&&cur){lines.push(cur);cur=w;}else cur=tt;}lines.push(cur);
    const lh=56,hh=lines.length*lh+30,mw=Math.max(...lines.map(l=>ctx.measureText(l).width))+56,y0=1790-hh/2;
    ctx.fillStyle='rgba(28,34,80,.62)';rr(540-mw/2,y0,mw,hh,26);ctx.fill();ctx.fillStyle='#fff';lines.forEach((l,i)=>ctx.fillText(l,540,y0+15+lh*i+lh/2+2));ctx.restore();}
}
function drawHUD(t){
  if(t<6.6)return;const a=sm((t-6.6)/.5)*(1-sm((t-B.black)/.2));ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(255,255,255,.85)';rr(40,60,300,58,29);ctx.fill();ctx.fillStyle='#ff4f6d';circ(72,89,9);ctx.fill();
  ctx.font=`800 26px ${FONT}`;setLS(3);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#2a3170';ctx.fillText('ELYRA · EP 01',92,90);setLS(0);ctx.restore();
}

// ------------------------------- RENDER UTAMA -------------------------
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  const [cx,cy,cz]=keys(CAM,t);cam.x=cx;cam.y=cy;cam.z=cz;
  if(t<5.2)drawSpace(t);else drawWorld(t);
  // transisi awan
  const wipe=win(t,4.4,6.0,.7,.75);if(wipe>0){ctx.fillStyle=`rgba(255,255,255,${wipe*.95})`;ctx.fillRect(0,0,W,H);
    for(let i=0;i<12;i++){const a=i/12*TAU,r=lerp(1400,500,wipe);ctx.fillStyle=`rgba(255,255,255,${wipe})`;circ(540+Math.cos(a+t)*r,960+Math.sin(a+t)*r*1.4,380);ctx.fill();}}
  // whip pan
  const wp=win(t,39.85,40.45,.2,.25);if(wp>0){ctx.fillStyle=`rgba(255,255,255,${wp*.55})`;for(let i=0;i<26;i++){const y=(i*83)%H;ctx.fillRect(0,y,W,8+i%3*6);}}
  // kilat ONLINE & impact
  for(const[at,a0]of[[B.online,.6],[19.85,.35]]){const f=t-at;if(f>0&&f<.35){ctx.fillStyle=`rgba(255,255,255,${a0*(1-f/.35)})`;ctx.fillRect(0,0,W,H);}}
  if(t>5.2)drawLabels(t);
  drawTexts(t);drawSubs(t);drawHUD(t);
  // potong hitam
  const bk=sm((t-B.black)/.15);if(bk>0){ctx.fillStyle=`rgba(8,10,28,${bk})`;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=sm((t-B.black-.15)/.3);ctx.font=`800 40px ${FONT}`;setLS(8);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('ELYRA',540,930);
    ctx.font=`600 28px ${FONT}`;setLS(4);ctx.fillStyle='#9aa6dd';ctx.fillText('EPISODE 02 · SEGERA',540,990);setLS(0);ctx.globalAlpha=1;}
}

// ------------------------------- AUDIO --------------------------------
let AC=null,master=null,dest=null,NB=null,soundOn=true;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.8;dest=AC.createMediaStreamDestination();master.connect(AC.destination);master.connect(dest);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
const mf=m=>440*Math.pow(2,(m-69)/12);
function osc(w,{f=440,f2=0,d=.3,type='sine',v=.1,a=.01,lp=0}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,w);if(f2)o.frequency.exponentialRampToValueAtTime(f2,w+d);
  g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v,w+a);g.gain.exponentialRampToValueAtTime(.0001,w+d);let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl;}
  n.connect(g);g.connect(master);o.start(w);o.stop(w+d+.05);}
function nz(w,{d=.3,v=.1,type='bandpass',f=800,f2=0,q=1,a=.01}){const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter(),g=AC.createGain();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,w);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,w+d);
  g.gain.setValueAtTime(.0001,w);g.gain.exponentialRampToValueAtTime(v,w+a);g.gain.exponentialRampToValueAtTime(.0001,w+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(w);s.stop(w+d+.05);}
const EV=[];
{const CH=[{p:[60,64,67,71],r:48},{p:[57,60,64,67],r:45},{p:[53,57,60,64],r:41},{p:[55,59,62,64],r:43}];
 const sec=[[0,35],[40.4,59.2]];let ci=0;
 for(const[s0,s1]of sec)for(let t0=s0;t0<s1-.5;t0+=5,ci++){const c=CH[ci%4],tt=t0;
   if(tt<34||tt>40)EV.push({t:tt,f:w=>c.p.forEach(n=>osc(w,{f:mf(n),d:5.4,type:'triangle',v:.022,a:1.2,lp:1400}))});
   for(let b=0;b<16;b++){const at=tt+b*.3125;if(at>=s1||at<7&&s0===0)continue;const n=c.p[[0,1,2,3,2,1,2,3][b%8]]+12;EV.push({t:at,f:w=>osc(w,{f:mf(n),d:.45,v:.035,a:.005})});}
   for(let b=0;b<4;b++){const at=tt+b*1.25;if(at>=s1||at<15&&s0===0)continue;EV.push({t:at,f:w=>osc(w,{f:mf(c.r-12),d:1.1,v:.08,a:.02,lp:400})});}}}
const SFX=[[0,w=>nz(w,{d:3.5,v:.12,f:300,f2:1400,q:.7,a:.8})],[4.0,w=>nz(w,{d:2.3,v:.18,type:'lowpass',f:500,f2:200,a:.4})],[6.2,w=>{osc(w,{f:110,f2:40,d:.5,v:.5});nz(w,{d:.5,v:.25,type:'lowpass',f:700})}],
 [6.9,w=>{nz(w,{d:.7,v:.1,f:900,q:2});osc(w,{f:240,f2:180,d:.6,v:.05,type:'triangle'})}],[8.3,'step'],[8.9,'step'],[9.5,w=>{nz(w,{d:.12,v:.3,type:'lowpass',f:600});osc(w,{f:90,f2:50,d:.4,v:.3});osc(w,{f:880,d:1.2,v:.04,a:.02})}],[10.3,'step'],[10.9,'step'],
 [16.2,'holo'],[18,'blip'],[18.4,'blip'],[18.8,'blip'],[19.7,'bp'],[19.85,'impact'],[23.3,w=>osc(w,{f:160,f2:70,d:.25,v:.35})],[23.7,w=>osc(w,{f:200,f2:320,d:.4,type:'sawtooth',v:.04,lp:900})],
 [24.4,w=>osc(w,{f:150,f2:600,d:4.5,v:.09,a:1,type:'triangle',lp:1500})],[25.2,w=>osc(w,{f:300,f2:900,d:3.6,v:.06,a:1.5})],[29,w=>{nz(w,{d:2,v:.15,f:400,f2:2500,q:1,a:.6});osc(w,{f:300,f2:900,d:1.8,v:.08,a:.3})}],
 [31,'impact'],[31,w=>osc(w,{f:110,d:3.2,v:.07,a:.3})],[37.4,w=>{osc(w,{f:880,d:.15,v:.1});osc(w+.12,{f:1320,d:.25,v:.1})}],[40,w=>nz(w,{d:.5,v:.3,f:2400,f2:300,q:1.2,a:.05})],
 [43.3,'holo'],[44.9,'bp'],[45.4,'bp'],[45.9,'bp'],[45.6,w=>osc(w,{f:660,f2:990,d:.18,v:.1})],[48.3,'blip'],[49.5,'blip'],[50.5,'blip'],[52.6,'bp'],[56.2,'holo'],[56.2,w=>osc(w,{f:130,f2:60,d:.6,v:.25})],[59.25,w=>osc(w,{f:220,d:.8,v:.06})]];
const SFXT={step:w=>nz(w,{d:.09,v:.22,type:'lowpass',f:500}),holo:w=>osc(w,{f:400,f2:1600,d:.4,v:.1}),blip:w=>osc(w,{f:1400,d:.09,v:.07}),bp:w=>osc(w,{f:900,f2:1300,d:.22,type:'triangle',v:.06}),
 impact:w=>{osc(w,{f:130,f2:38,d:.9,v:.5});nz(w,{d:.35,v:.2,type:'lowpass',f:900})}};
for(const[at,fn]of SFX)EV.push({t:at,f:typeof fn==='string'?SFXT[fn]:fn});
EV.sort((a,b)=>a.t-b.t);
let evI=0,lastT=0;
function audioTick(t){if(!AC||paused)return;if(t<lastT-.05){evI=0;}lastT=t;
  while(evI<EV.length&&EV[evI].t<t+.3){const e=EV[evI++];if(e.t>=t-.08){try{e.f(AC.currentTime+Math.max(0,e.t-t));}catch(_){}}}}

// ------------------------------- KONTROL ------------------------------
let t0=performance.now(),paused=false,pauseT=0,rec=null,chunks=[],lastSec=-1;
const cur=()=>paused?pauseT:(performance.now()-t0)/1000;
const recBtn=document.getElementById('rec'),rpBtn=document.getElementById('rp'),paBtn=document.getElementById('pa'),sndBtn=document.getElementById('snd');
function restart(){paused=false;paBtn.textContent='Jeda';t0=performance.now();evI=0;lastT=0;}
function frame(){
  let t=cur();
  if(t>=DUR){if(rec&&rec.state==='recording'){draw(DUR-.001);rec.stop();}else if(!rec){restart();t=0;}}
  draw(Math.min(t,DUR-.001));
  if(!rec||rec.state==='recording')audioTick(Math.min(t,DUR));
  if(rec&&rec.state==='recording'){const s=Math.floor(t);if(s!==lastSec){lastSec=s;st.textContent='Merekam... '+Math.max(0,DUR-s)+' detik lagi. Jangan pindah tab.';}}
  requestAnimationFrame(frame);
}
recBtn.addEventListener('click',async()=>{
  if(rec)return;if(!window.MediaRecorder||!cv.captureStream){st.textContent='Browser ini belum mendukung perekaman. Coba Chrome atau Edge di laptop.';return;}
  initAudio();if(AC&&AC.state!=='running')try{await AC.resume();}catch(_){}
  const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  chunks=[];const stream=cv.captureStream(30);if(dest&&soundOn)dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});}catch(e){st.textContent='Gagal mulai merekam: '+e.message;rec=null;return;}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{const type=rec.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:type.split(';')[0]}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='elyra-episode-01.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    st.textContent=ext==='mp4'?'Selesai! File MP4 sudah terunduh (cek folder Downloads).':'Selesai! File WebM sudah terunduh. Kalau aplikasimu tidak bisa membukanya, ubah dulu ke MP4.';
    rec=null;recBtn.disabled=false;paBtn.disabled=false;rpBtn.disabled=false;restart();};
  restart();lastSec=-1;rec.start(500);recBtn.disabled=true;paBtn.disabled=true;rpBtn.disabled=true;
});
rpBtn.addEventListener('click',async()=>{if(rec)return;initAudio();if(AC&&AC.state!=='running')try{await AC.resume();}catch(_){}restart();st.textContent='Memutar dari awal.';});
paBtn.addEventListener('click',()=>{if(rec)return;if(!paused){pauseT=cur();paused=true;paBtn.textContent='Lanjut';}else{t0=performance.now()-pauseT*1000;paused=false;paBtn.textContent='Jeda';evI=EV.findIndex(e=>e.t>=pauseT);if(evI<0)evI=EV.length;}});
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;sndBtn.textContent='Suara: '+(soundOn?'ON':'OFF');if(master)master.gain.value=soundOn?.8:0;});
{const q=new URLSearchParams(location.search).get('t');if(q!==null){draw(+q);}else requestAnimationFrame(frame);}
})();
